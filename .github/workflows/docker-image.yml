name: Docker Image CI

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Git Semantic Version
      uses: PaulHatch/semantic-version@v5.4.0
      with:
        major_pattern: "major:"
        minor_pattern: "feat:"
        version_format: "${major}.${minor}.${patch}-beta-${increment}"
      id: version  
        
    - name: Docker Login
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "Nueva Version: $NEW_VERSION "
        echo "Iniciando Login"
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD
        echo "Finalizando Login"
    
    - name: Show version
      env:
        NEW_VERSION: ${{ steps.version.outputs.version }}  
      run: |
        echo "Versión generada: $NEW_VERSION"

        
    - name: Build Docker Image
      env:
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        echo "Inicio Build"
        docker build -t jmolina24/docker-graphql:$NEW_VERSION .
        echo "Finalizando Build"

    - name: Push Docker Image
      env:
        NEW_VERSION: ${{ steps.version.outputs.version }}    
      run: |
        echo "Inicio Push"
        docker push jmolina24/docker-graphql:$NEW_VERSION
        echo "Finalizando Push" 
      
    
    #- name: Build the Docker image
    #  run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
